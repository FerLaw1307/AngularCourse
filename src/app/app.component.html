<j-header />
<main>
  <ul id="users">
    @for(usuario of users; track usuario.id){
    <li>
      <app-user [user]="usuario" [seleccionado]="usuario.id === userIdSelected" (selected)="onSelectedUser($event)" />
    </li>
    }
  </ul>
  @if(selectedUser){
    <app-tasks 
    [idUsuario]="selectedUser.id"
    [userName]="selectedUser.nombre"></app-tasks>
  }@else {
    <p id="textoCondicional">Selecciona un usuario de la lista.</p>
  }
</main>
